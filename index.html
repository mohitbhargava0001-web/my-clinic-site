<script>
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDF4uLFVQqujkp6LgoSs29_CN0FeSC65qY",
        authDomain: "family-health-care-centre.firebaseapp.com",
        projectId: "family-health-care-centre"
    };

    // YAHAN APNI DOCTOR KI GMAIL ID LIKHEIN (small letters mein)
    // Example: const DOCTOR_EMAILS = ["doctor.clinic@gmail.com"];
    const DOCTOR_EMAILS = [
        // apni doctor email yahan likhein
    ];

    const SESSION_STORAGE_KEY = "fhcc_clinic_session_v1";
    const FIRESTORE_BASE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents`;

    const statusEl = document.getElementById("loginStatus");
    const errEl = document.getElementById("loginError");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");

    let authToken = null;
    let currentUid = null;
    let currentEmail = null;
    let currentRole = "reception";
    let isLoggedInSession = false;
    let patientsCache = [];
    let appointmentsCache = [];
    let visitsCache = [];
    let selectedPatientId = null;
    let nextTokenCounter = 1;

    const todayISO = () => new Date().toISOString().split("T")[0];
    document.getElementById("visitDate").value = todayISO();

    function updateSaveButtonLabel() {
        const btn = document.getElementById("savePatientBtn");
        if (!btn) return;
        btn.textContent = currentRole === "doctor"
            ? "Save Patient Directly (No Waiting)"
            : "Save & Add to Waiting";
    }

    function showDashboardView(role, email) {
        currentRole = role === "doctor" ? "doctor" : "reception";
        isLoggedInSession = true;

        document.getElementById("loggedUserEmail").textContent =
            `Logged in: ${email || "Unknown"} | Role: ${currentRole.toUpperCase()}`;

        if (currentRole === "doctor") {
            document.getElementById("roleTitle").textContent = "Doctor Dashboard";
            document.getElementById("roleBadge").textContent = "DOCTOR";
            document.getElementById("addFormHeading").textContent = "Add Patient (Doctor)";
            document.getElementById("doctorSidePanel").classList.remove("hidden");
            document.getElementById("receptionSidePanel").classList.add("hidden");
            document.getElementById("doctorTreatmentCard").classList.remove("hidden");
        } else {
            document.getElementById("roleTitle").textContent = "Reception Dashboard";
            document.getElementById("roleBadge").textContent = "RECEPTION";
            document.getElementById("addFormHeading").textContent = "Add New Patient";
            document.getElementById("receptionSidePanel").classList.remove("hidden");
            document.getElementById("doctorSidePanel").classList.add("hidden");
            document.getElementById("doctorTreatmentCard").classList.add("hidden");
        }

        updateSaveButtonLabel();
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").style.display = "block";
    }

    function showLoginView() {
        isLoggedInSession = false;
        document.getElementById("dashboardSection").style.display = "none";
        document.getElementById("loginSection").classList.remove("hidden");
    }

    function saveClinicSession(sessionData) {
        try {
            localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionData));
        } catch (err) {
            console.error("Session save error:", err);
        }
    }

    function clearClinicSession() {
        authToken = null;
        currentUid = null;
        currentEmail = null;
        currentRole = "reception";
        isLoggedInSession = false;
        try {
            localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (err) {
            console.error("Session clear error:", err);
        }
    }

    async function refreshIdTokenIfNeeded(session) {
        if (!session.refreshToken) return session.idToken;
        const res = await fetch(
            `https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    grant_type: "refresh_token",
                    refresh_token: session.refreshToken
                })
            }
        );
        if (!res.ok) throw new Error("Token refresh failed");
        const data = await res.json();
        const updatedSession = {
            ...session,
            idToken: data.id_token,
            refreshToken: data.refresh_token || session.refreshToken,
            uid: data.user_id || session.uid
        };
        saveClinicSession(updatedSession);
        return updatedSession.idToken;
    }

    function toFirestoreFields(obj) {
        const fields = {};
        for (const [k, v] of Object.entries(obj)) {
            if (v === null || v === undefined) continue;
            if (typeof v === "number") {
                fields[k] = Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
            } else {
                fields[k] = { stringValue: String(v) };
            }
        }
        return fields;
    }

    function fromFirestoreDoc(doc) {
        const out = { id: doc.name.split("/").pop() };
        const fields = doc.fields || {};
        for (const [k, val] of Object.entries(fields)) {
            if ("stringValue" in val) out[k] = val.stringValue;
            else if ("integerValue" in val) out[k] = Number(val.integerValue);
            else if ("doubleValue" in val) out[k] = Number(val.doubleValue);
        }
        return out;
    }

    async function upsertDoc(collectionName, docId, dataObj) {
        if (!authToken) return;
        const url = `${FIRESTORE_BASE_URL}/${collectionName}/${docId}`;
        await fetch(url, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${authToken}`
            },
            body: JSON.stringify({ fields: toFirestoreFields(dataObj) })
        });
    }

    async function listDocs(collectionName) {
        if (!authToken) return [];
        const url = `${FIRESTORE_BASE_URL}/${collectionName}?pageSize=200`;
        const res = await fetch(url, {
            headers: { Authorization: `Bearer ${authToken}` }
        });
        if (!res.ok) return [];
        const data = await res.json();
        return (data.documents || []).map(fromFirestoreDoc);
    }

    async function resolveUserRole(email = "", uid = "") {
        const cleanEmail = (email || "").trim().toLowerCase();
        const doctorList = DOCTOR_EMAILS.map(e => String(e || "").trim().toLowerCase()).filter(Boolean);

        if (
            doctorList.includes(cleanEmail) ||
            cleanEmail.includes("doctor") ||
            cleanEmail.includes("dr.") ||
            cleanEmail.startsWith("dr")
        ) {
            return "doctor";
        }

        if (authToken) {
            for (const colName of ["users", "staff_roles", "roles", "staff"]) {
                try {
                    const docs = await listDocs(colName);
                    const matched = docs.find(d =>
                        (uid && (d.id === uid || d.uid === uid)) ||
                        ((d.email || "").trim().toLowerCase() === cleanEmail)
                    );
                    const rawRole = (matched?.role || matched?.userRole || matched?.type || "").toLowerCase();
                    if (rawRole) {
                        return rawRole.includes("doc") ? "doctor" : "reception";
                    }
                } catch (_) {
                    // Agla collection try karein
                }
            }
        }

        return "reception";
    }

    async function loadAllClinicData() {
        if (!authToken) return;
        const [pats, appts, visits] = await Promise.all([
            listDocs("patients"),
            listDocs("appointments"),
            listDocs("visits")
        ]);
        patientsCache = pats.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
        appointmentsCache = appts.sort((a, b) => (a.token || 0) - (b.token || 0));
        visitsCache = visits.sort((a, b) => (b.visitDate || "").localeCompare(a.visitDate || ""));
        const maxToken = appointmentsCache.reduce((m, item) => Math.max(m, Number(item.token) || 0), 0);
        nextTokenCounter = maxToken + 1;
        renderAllViews();
    }

    async function restoreClinicSession() {
        try {
            const raw = localStorage.getItem(SESSION_STORAGE_KEY);
            if (!raw) {
                showLoginView();
                return;
            }
            const saved = JSON.parse(raw);
            if (!saved || !saved.email) {
                showLoginView();
                return;
            }
            currentEmail = saved.email;
            currentUid = saved.uid || null;
            authToken = saved.idToken || null;

            if (saved.idToken && saved.refreshToken) {
                try {
                    authToken = await refreshIdTokenIfNeeded(saved);
                } catch (_) {
                    // Offline fallback
                }
            }

            currentRole = await resolveUserRole(currentEmail, currentUid);
            saveClinicSession({
                idToken: authToken || saved.idToken,
                refreshToken: saved.refreshToken,
                uid: currentUid,
                email: currentEmail,
                role: currentRole
            });

            showDashboardView(currentRole, currentEmail);
            await loadAllClinicData();
        } catch (err) {
            console.error("Restore session error:", err);
            showLoginView();
        }
    }

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.textContent = "";
        statusEl.textContent = "Logging in...";
        loginBtn.disabled = true;

        const typedEmail = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
            const res = await fetch(
                `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_CONFIG.apiKey}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: typedEmail, password, returnSecureToken: true })
                }
            );
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data?.error?.message || "Invalid email or password");
            }

            authToken = data.idToken;
            currentUid = data.localId;
            currentEmail = data.email || typedEmail;
            currentRole = await resolveUserRole(currentEmail, currentUid);

            saveClinicSession({
                idToken: data.idToken,
                refreshToken: data.refreshToken,
                uid: data.localId,
                email: currentEmail,
                role: currentRole
            });

            statusEl.textContent = "";
            showDashboardView(currentRole, currentEmail);
            await loadAllClinicData();
        } catch (err) {
            statusEl.textContent = "";
            errEl.textContent = err.message || "Login failed";
        } finally {
            loginBtn.disabled = false;
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        clearClinicSession();
        showLoginView();
    });

    window.switchMainTab = function(tab) {
        const addTab = document.getElementById("addTabContent");
        const histTab = document.getElementById("historyTabContent");
        const btnAdd = document.getElementById("tabAddBtn");
        const btnHist = document.getElementById("tabHistoryBtn");

        if (tab === "history") {
            addTab.classList.add("hidden");
            histTab.classList.remove("hidden");
            btnAdd.classList.remove("active");
            btnHist.classList.add("active");
            renderQuickPatientsList();
            renderPatientHistoryView();
        } else {
            histTab.classList.add("hidden");
            addTab.classList.remove("hidden");
            btnHist.classList.remove("active");
            btnAdd.classList.add("active");
        }
    };

    document.getElementById("addPatientForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const patientData = {
            name: document.getElementById("pName").value.trim(),
            mobile: document.getElementById("pMobile").value.trim(),
            age: Number(document.getElementById("pAge").value),
            gender: document.getElementById("pGender").value,
            address: document.getElementById("pAddress").value.trim(),
            problem: document.getElementById("pProblem").value.trim(),
            addedByRole: currentRole,
            addedByEmail: currentEmail || "",
            status: currentRole === "doctor" ? "saved_direct" : "waiting",
            createdAt: new Date().toISOString()
        };

        const patientDocId = "pat_" + Date.now();
        const savedPatient = { id: patientDocId, ...patientData };
        patientsCache.unshift(savedPatient);
        await upsertDoc("patients", patientDocId, patientData);

        const tokenBox = document.getElementById("tokenResultBox");
        if (currentRole === "doctor") {
            selectedPatientId = patientDocId;
            tokenBox.style.display = "block";
            tokenBox.textContent = `Patient "${patientData.name}" seedha save ho gaya (Waiting list mein nahi bheja gaya).`;
        } else {
            const tokenNumber = nextTokenCounter++;
            const apptId = "appt_" + Date.now();
            const apptData = {
                patientId: patientDocId,
                name: patientData.name,
                mobile: patientData.mobile,
                problem: patientData.problem,
                token: tokenNumber,
                status: "waiting",
                createdAt: new Date().toISOString()
            };
            appointmentsCache.push({ id: apptId, ...apptData });
            await upsertDoc("appointments", apptId, apptData);

            tokenBox.style.display = "block";
            tokenBox.textContent = `Patient save hua! Token Number: #${tokenNumber}`;
        }

        document.getElementById("addPatientForm").reset();
        renderAllViews();
    });

    window.markPatientSeen = async function(apptId) {
        const idx = appointmentsCache.findIndex(a => a.id === apptId);
        if (idx === -1) return;
        appointmentsCache[idx].status = "seen";
        appointmentsCache[idx].seenAt = new Date().toISOString();
        selectedPatientId = appointmentsCache[idx].patientId || null;
        await upsertDoc("appointments", apptId, appointmentsCache[idx]);
        renderAllViews();
    };

    function renderAllViews() {
        const waitingItems = appointmentsCache.filter(a => a.status === "waiting");
        const seenItems = appointmentsCache.filter(a => a.status === "seen").slice(-5).reverse();

        document.getElementById("waitingCountDoc").textContent = waitingItems.length;
        document.getElementById("waitingCountRec").textContent = waitingItems.length;

        const docWaitEl = document.getElementById("doctorWaitingList");
        const recWaitEl = document.getElementById("receptionWaitingList");
        const seenEl = document.getElementById("lastSeenList");

        if (!waitingItems.length) {
            docWaitEl.innerHTML = `<p class="muted">Abhi waiting mein koi patient nahi hai.</p>`;
            recWaitEl.innerHTML = `<p class="muted">Abhi waiting list khaali hai.</p>`;
        } else {
            docWaitEl.innerHTML = waitingItems.map(item => `
                <div class="queue-item">
                    <div>
                        <span class="token-pill">#${item.token}</span>
                        <strong>${item.name}</strong> (${item.mobile})<br>
                        <span class="muted">${item.problem}</span>
                    </div>
                    <button class="btn btn-sm btn-success" onclick="markPatientSeen('${item.id}')">Mark Seen</button>
                </div>
            `).join("");

            recWaitEl.innerHTML = waitingItems.map(item => `
                <div class="queue-item">
                    <div>
                        <span class="token-pill">#${item.token}</span>
                        <strong>${item.name}</strong> (${item.mobile})<br>
                        <span class="muted">${item.problem}</span>
                    </div>
                </div>
            `).join("");
        }

        seenEl.innerHTML = seenItems.length
            ? seenItems.map(item => `
                <div class="seen-item">
                    <div><strong>${item.name}</strong> (${item.mobile})<br><span class="muted">${item.problem}</span></div>
                    <button class="btn btn-sm btn-blue" onclick="selectPatientForHistory('${item.patientId || ""}')">Open History</button>
                </div>
            `).join("")
            : `<p class="muted">Abhi kisi patient ka checkup complete nahi hua.</p>`;

        renderQuickPatientsList();
        renderPatientHistoryView();
    }

    function renderQuickPatientsList() {
        const box = document.getElementById("allPatientsQuickList");
        if (!box) return;
        const recent = patientsCache.slice(0, 6);
        if (!recent.length) {
            box.innerHTML = "";
            return;
        }
        box.innerHTML = `<div class="muted" style="margin-bottom:6px;">Recent Patients:</div>` + recent.map(p => `
            <button type="button" class="btn btn-sm btn-blue" style="margin:2px;" onclick="selectPatientForHistory('${p.id}')">
                ${p.name} (${p.mobile})
            </button>
        `).join("");
    }

    window.selectPatientForHistory = function(patientId) {
        selectedPatientId = patientId;
        renderPatientHistoryView();
    };

    window.searchPatientByMobile = function() {
        const q = document.getElementById("searchMobileInput").value.trim();
        if (!q) {
            renderPatientHistoryView();
            return;
        }
        const found = patientsCache.find(p => String(p.mobile || "").includes(q));
        selectedPatientId = found ? found.id : null;
        renderPatientHistoryView(q);
    };

    function renderPatientHistoryView(searchTerm = "") {
        const resEl = document.getElementById("patientHistoryResult");
        const bannerEl = document.getElementById("selectedPatientBanner");
        const patient = patientsCache.find(p => p.id === selectedPatientId);

        if (!patient) {
            if (bannerEl) bannerEl.textContent = "Pehle koi patient select karein.";
            resEl.innerHTML = searchTerm
                ? `<p class="muted">"${searchTerm}" ke liye koi patient record nahi mila.</p>`
                : `<p class="muted">Kisi patient ka mobile number search karein ya upar list se chunein.</p>`;
            return;
        }

        if (bannerEl) {
            bannerEl.textContent = `Selected Patient: ${patient.name} (${patient.mobile})`;
        }

        const pVisits = visitsCache.filter(v => v.patientId === patient.id);
        resEl.innerHTML = `
            <div class="patient-summary">
                <div><strong>Name:</strong> ${patient.name} | <strong>Age/Gender:</strong> ${patient.age} / ${patient.gender || "-"}</div>
                <div><strong>Mobile:</strong> ${patient.mobile} | <strong>Address:</strong> ${patient.address || "-"}</div>
                <div><strong>Initial Problem:</strong> ${patient.problem}</div>
            </div>
            ${pVisits.length ? pVisits.map(v => `
                <div class="visit-card">
                    <div class="visit-header">Visit Date: ${v.visitDate || "-"} | Bill: ₹${v.bill || 0}</div>
                    <div><strong>Treatment:</strong> ${v.treatment || "-"}</div>
                    <div><strong>Medicine/Item:</strong> ${v.items || "-"}</div>
                    <div class="muted">Next Date: ${v.nextDate || "-"}</div>
                </div>
            `).join("") : `<p class="muted">Is patient ki abhi koi visit entry nahi hai.</p>`}
        `;
    }

    document.getElementById("visitUpdateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!selectedPatientId) {
            alert("Pehle koi patient select ya search karein.");
            return;
        }
        const visitId = "vis_" + Date.now();
        const visitObj = {
            patientId: selectedPatientId,
            visitDate: document.getElementById("visitDate").value,
            treatment: document.getElementById("visitTreatment").value.trim(),
            items: document.getElementById("visitItems").value.trim(),
            bill: Number(document.getElementById("visitBill").value || 0),
            lastVisitDate: document.getElementById("lastVisitDateInput").value,
            nextDate: document.getElementById("nextDateInput").value,
            createdAt: new Date().toISOString()
        };
        visitsCache.unshift({ id: visitId, ...visitObj });
        await upsertDoc("visits", visitId, visitObj);
        document.getElementById("visitUpdateForm").reset();
        document.getElementById("visitDate").value = todayISO();
        renderPatientHistoryView();
    });

    window.addEventListener("DOMContentLoaded", restoreClinicSession);
</script>
