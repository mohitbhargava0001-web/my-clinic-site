<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Health Care Centre</title>
    <!-- Google Fonts for stylish Hindi & English typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Tiro+Devanagari+Hindi&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 55px 40px;
            border-radius: 24px;
            max-width: 850px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            border: 3px solid #d4af37;
            position: relative;
            animation: fadeInUp 1.2s ease-out;
        }

        .medical-icon {
            font-size: 3.5rem;
            color: #0d9488;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .clinic-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #0f766e, #0284c7, #0f766e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 10px;
            line-height: 1.2;
            text-shadow: 2px 4px 10px rgba(15, 118, 110, 0.15);
        }

        .welcome-hindi {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 2.3rem;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .divider {
            height: 3px;
            width: 140px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 28px auto;
        }

        .coming-soon {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 1.85rem;
            color: #0f766e;
            background: #f0fdfa;
            padding: 16px 32px;
            border-radius: 50px;
            display: inline-block;
            border: 1.5px dashed #0d9488;
            box-shadow: 0 6px 18px rgba(13, 148, 136, 0.12);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @media (max-width: 600px) {
            .welcome-card {
                padding: 35px 20px;
            }
            .clinic-name {
                font-size: 2rem;
            }
            .welcome-hindi {
                font-size: 1.65rem;
            }
            .coming-soon {
                font-size: 1.3rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="medical-icon">✚</div>
        <h1 class="clinic-name">Family Health Care Centre</h1>
        <p class="welcome-hindi">में आपका स्वागत है</p>
        <div class="divider"></div>
        <p class="coming-soon">✨ जल्द ही हम आपकी सेवाओं में उपलब्ध होंगे ✨</p>
    </div>

</body>
</html>
